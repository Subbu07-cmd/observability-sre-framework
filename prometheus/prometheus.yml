global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: demo

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: [localhost:9090] }]

  - job_name: node
    static_configs: [{ targets: [node-exporter:9100] }]
    # In AWS, replace with:
    # ec2_sd_configs: [{ region: us-east-1, port: 9100, filters: [{ name: tag:Monitoring, values: [enabled] }] }]

  - job_name: demo-app
    static_configs: [{ targets: [demo-app:8080], labels: { service: demo-app } }]
